name: ASC optimise imported images
on:
  push:
    branches:
      - asc-full-multipage-rebuild-20261013
    paths:
      - ".github/workflows/asc-optimize-media.yml"
      - "aberdeen-self-catering/scripts/optimize_media.py"
permissions:
  contents: write
jobs:
  compress:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asc-full-multipage-rebuild-20261013
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Compress original photos and change references to local WebP files
        working-directory: aberdeen-self-catering
        run: python scripts/optimize_media.py
      - name: Commit optimised images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A aberdeen-self-catering/public/media aberdeen-self-catering/lib/content.ts aberdeen-self-catering/app/page.tsx
          if ! git diff --staged --quiet; then
            git commit -m "Optimise independent ASC photo galleries to responsive WebP images"
            git push origin HEAD:asc-full-multipage-rebuild-20261013
          fi
