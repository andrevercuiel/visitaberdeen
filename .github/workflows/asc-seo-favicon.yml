name: ASC generate Google-friendly favicon
on:
  push:
    branches:
      - seo-google-visibility-20261014
    paths:
      - ".github/workflows/asc-seo-favicon.yml"
      - "aberdeen-self-catering/scripts/build_favicon.py"
permissions:
  contents: write
jobs:
  favicon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-google-visibility-20261014
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Produce search and mobile icon assets
        working-directory: aberdeen-self-catering
        run: python scripts/build_favicon.py
      - name: Commit favicon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aberdeen-self-catering/app/icon.png aberdeen-self-catering/app/apple-icon.png aberdeen-self-catering/public/favicon.ico
          if ! git diff --staged --quiet; then
            git commit -m "Generate Google Search favicon from official Aberdeen logo"
            git push origin HEAD:seo-google-visibility-20261014
          fi
